<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sorting Visualizer</title>
  <title>Sorting Visualizer changed</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Sorting Visualizer</h1>

  <div class="controls">
    <input type="text" id="userInput" placeholder="Enter numbers separated by commas (e.g., 10,50,30)" />
    <button onclick="visualizeArray()">Visualize</button>
    <button onclick="bubbleSort()">Bubble Sort</button>
    <button onclick="selectionSort()">Selection Sort</button>
    <button onclick="insertionSort()">Insertion Sort</button>
    <button onclick="mergeSort()">Merge Sort</button>
    <button onclick="quickSortStart()">Quick Sort</button>
  </div>

  <div class="array-container" id="array"></div>

  <script src="app.js"></script>
</body>

</html>
